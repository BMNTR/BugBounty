<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nexus - Group Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 160px); }
        .markdown-body pre { background-color: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem;}
        .markdown-body code { font-family: monospace; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .typing-dot { animation: blink 1.4s infinite both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse" id="status-indicator"></div>
            <h1 class="text-xl font-bold tracking-wider text-white">AI NEXUS</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-sm text-gray-400">
                <span class="text-blue-400 font-semibold">@User</span>,
                <span class="text-purple-400 font-semibold">@Antigravity</span>,
                <span class="text-green-400 font-semibold">@OpenCode</span>
            </div>
            <button id="reset-btn" class="text-xs px-3 py-1 bg-red-700 hover:bg-red-600 text-white rounded transition">
                Reset
            </button>
        </div>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 chat-container bg-gray-900 scroll-smooth">
        <div class="flex flex-col items-center justify-center h-full text-gray-500 space-y-2 opacity-50" id="empty-state">
            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
            <p>Welcome to the Nexus.</p>
            <p class="text-sm">User, OpenCode, and Antigravity — all in one shared conversation.</p>
        </div>
    </main>

    <div id="agent-status" class="hidden px-4 py-1 bg-gray-800 border-t border-gray-700 flex gap-4 text-xs">
        <span id="oc-status" class="text-green-500 flex items-center gap-1">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span> OpenCode
        </span>
        <span id="ag-status" class="text-purple-500 flex items-center gap-1">
            <span class="w-2 h-2 bg-purple-500 rounded-full"></span> Antigravity
        </span>
    </div>

    <div id="image-preview-container" class="hidden px-4 py-2 bg-gray-800 border-t border-gray-700">
        <div class="relative inline-block">
            <img id="image-preview" class="h-20 w-auto rounded border border-gray-600 object-cover" src="#" alt="Preview">
            <button onclick="clearImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold hover:bg-red-600">&times;</button>
        </div>
    </div>

    <footer class="bg-gray-800 p-4 border-t border-gray-700">
        <form id="chat-form" class="flex gap-2 max-w-6xl mx-auto items-end">
            <label class="cursor-pointer p-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                <input type="file" id="image-input" class="hidden" accept="image/*">
            </label>
            <textarea id="message-input" rows="1" class="flex-1 bg-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="Message the Nexus..."></textarea>
            <button type="submit" id="send-btn" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-semibold disabled:opacity-50 flex gap-2 items-center">
                <span>Send</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const sendBtn = document.getElementById('send-btn');
        const emptyState = document.getElementById('empty-state');
        const statusIndicator = document.getElementById('status-indicator');
        const agentStatus = document.getElementById('agent-status');
        const ocStatus = document.getElementById('oc-status');
        const agStatus = document.getElementById('ag-status');
        const resetBtn = document.getElementById('reset-btn');

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        messageInput.addEventListener('paste', function(e) {
            if (e.clipboardData.files.length > 0) {
                imageInput.files = e.clipboardData.files;
                imageInput.dispatchEvent(new Event('change'));
            }
        });

        function clearImage() {
            imageInput.value = '';
            imagePreview.src = '#';
            imagePreviewContainer.classList.add('hidden');
        }

        const activeBubbles = {};

        function createMessageBubble(sender, role, imageUrl) {
            if (emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col max-w-4xl w-full ${role === 'user' ? 'ml-auto items-end' : 'mr-auto items-start'}`;

            const nameDiv = document.createElement('div');
            const color = role === 'user' ? 'text-blue-400' :
                sender === 'OpenCode' ? 'text-green-400' : 'text-purple-400';
            nameDiv.className = `text-xs font-semibold mb-1 px-1 flex items-center gap-2 ${color}`;
            nameDiv.innerHTML = `<span>${sender}</span>`;

            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-2xl shadow-sm markdown-body w-full overflow-x-hidden ${
                role === 'user' ? 'bg-blue-600 text-white rounded-br-none' :
                'bg-gray-800 border border-gray-700 text-gray-200 rounded-bl-none'
            }`;

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = "max-h-60 rounded mb-2 object-contain bg-gray-900";
                bubble.appendChild(img);
            }

            const textContent = document.createElement('div');
            textContent.className = 'whitespace-pre-wrap';
            bubble.appendChild(textContent);

            wrapper.appendChild(nameDiv);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            return { wrapper, textContent, nameDiv, rawText: '' };
        }

        function finalizeBubble(bubbleObj) {
            if (!bubbleObj) return;
            bubbleObj.textContent.innerHTML = marked.parse(bubbleObj.rawText);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setAgentActive(agent, active) {
            const el = agent === 'OpenCode' ? ocStatus : agStatus;
            if (active) {
                el.classList.remove('opacity-40');
                el.querySelector('span').classList.add('animate-pulse');
            } else {
                el.classList.add('opacity-40');
                el.querySelector('span').classList.remove('animate-pulse');
            }
        }

        resetBtn.addEventListener('click', async function() {
            if (!confirm('Reset conversation history?')) return;
            await fetch('/api/reset', { method: 'POST' });
            chatBox.innerHTML = '';
            activeBubbles.length = 0;
            location.reload();
        });

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            const file = imageInput.files[0];

            if (!message && !file) return;

            let imageUrl = null;
            if (file) {
                imageUrl = imagePreview.src;
            }

            const userBubble = createMessageBubble('You', 'user', imageUrl);
            userBubble.textContent.innerText = message;

            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            statusIndicator.classList.replace('bg-green-500', 'bg-yellow-500');
            agentStatus.classList.remove('hidden');
            setAgentActive('OpenCode', true);
            setAgentActive('Antigravity', true);
            clearImage();

            const formData = new FormData();
            formData.append('message', message);
            if (file) formData.append('image', file);

            let ocCompleted = false;
            let agCompleted = false;

            try {
                const response = await fetch('/api/message', {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split("\n\n");
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (part.startsWith("data: ")) {
                            try {
                                const data = JSON.parse(part.substring(6));

                                if (data.status === "complete") {
                                    if (data.agent === 'OpenCode') ocCompleted = true;
                                    if (data.agent === 'Antigravity') agCompleted = true;
                                    if (activeBubbles[data.agent]) {
                                        finalizeBubble(activeBubbles[data.agent]);
                                        delete activeBubbles[data.agent];
                                    }
                                    setAgentActive(data.agent, false);
                                    continue;
                                }

                                if (!activeBubbles[data.agent]) {
                                    activeBubbles[data.agent] = createMessageBubble(data.agent, 'ai');
                                }

                                activeBubbles[data.agent].rawText += data.text;
                                activeBubbles[data.agent].textContent.innerText = activeBubbles[data.agent].rawText;
                                chatBox.scrollTop = chatBox.scrollHeight;

                            } catch (e) {
                                console.error("Parse error", e, part);
                            }
                        }
                    }
                }

                for (const agent in activeBubbles) {
                    finalizeBubble(activeBubbles[agent]);
                    delete activeBubbles[agent];
                }

            } catch (err) {
                const errBubble = createMessageBubble('System Error', 'ai');
                errBubble.textContent.innerText = err.toString();
            } finally {
                sendBtn.disabled = false;
                statusIndicator.classList.replace('bg-yellow-500', 'bg-green-500');
                agentStatus.classList.add('hidden');
                setAgentActive('OpenCode', false);
                setAgentActive('Antigravity', false);
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
